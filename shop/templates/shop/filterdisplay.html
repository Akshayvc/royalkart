{% extends 'shop/basic.html' %}
{% load static %}

{% block body %}
{% for j in edit1 %}
<h1><strong>{{j.shop_name}} Products</strong></h1>
{% endfor %}

<div class="container carousel-inner no-padding">
        <div class="carousel-item active">
            <div class="row">
                {% for i in details %}
                <div class="col-xs-3 col-sm-3 col-md-3">
                    <div class="card align-items-center"style="background-color:#FFBC99;border-radius: 10rem;padding-bottom: 50px;">
                        <img src="{% if i.image %} {{ i.image.url }} {% else %} {% static 'shop/sample.jpg' %} {% endif %}"
                            class="card-img-top" alt="..." height="300">
                        <div class="card-body">
                            <h5 class="card-title" id="namepr{{i.id}}">{{i.product_name}}</h5>
                            <h6 class="card-title">Price: <span id="pricepr{{i.id}}">{{i.price}}</span></h6>
                            <h6 class="card-title" id="pnamepr{{i.id}}">{{i.shop_name}}</h6>
                            <h6 class="card-title" id="pnamepr{{i.id}}">Rank:{{i.rate}}</h6>
                            <center>
                            <span id="divpr{{i.id}}" class="divpr">
                                <button id="pr{{i.id}}" class="btn btn-primary cart">Add To Cart</button>
                            </span>
                            <a href="/shop/products/{{i.id}}"><button id="qv{{i.id}}"
                                    class="btn btn-primary cart" style="font-size:1rem;margin-top:3%;line-height:1.5;">QuickView</button></a>
                                </center>
                        </div>
                    </div>
                </div>
                {% endfor %}

            </div>
        </div>
    </div>

</div>
{% endblock %}
{% block js %}
<script>
    // Find out the cart items from localStorage
    if (localStorage.getItem('cart') == null) {
        var cart = {};
    } else {
        cart = JSON.parse(localStorage.getItem('cart'));
        updateCart(cart);
    }
    // If the add to cart button is clicked, add/increment the item
    //$('.cart').click(function() {
    $('.divpr').on('click', 'button.cart', function () {
        var idstr = this.id.toString();
        if (cart[idstr] != undefined) {
            qty = cart[idstr][0] + 1;
        } else {
            qty = 1;
            name = document.getElementById('name' + idstr).innerHTML;
            pname = document.getElementById('pname' + idstr).innerHTML;
            price = qty * document.getElementById('price' + idstr).innerHTML;
            cart[idstr] = [qty, name, parseInt(price), pname];
        }
        updateCart(cart);
    });
    //Add Popover to cart
    $('#popcart').popover();
    updatePopover(cart);
    function updatePopover(cart) {
        console.log('We are inside updatePopover');
        var popStr = "";
        popStr = popStr + "<h5> Cart for your items in my shopping cart </h5><div class='row mx-2 my-2'>";
        var i = 1;
        for (var item in cart) {
            popStr = popStr + "<b>" + i + "</b>. ";
            popStr = popStr + document.getElementById('name' + item).innerHTML.slice(0, 19) + "... Qty: " + cart[item] + '<br>';
            i = i + 1;
        }
        popStr = popStr + "</div> <a href='/shop/checkout'><button class='btn btn-primary' id ='checkout'>Checkout</button></a> <button class='btn btn-primary' onclick='clearCart()' id ='clearCart'>Clear Cart</button>"
        console.log(popStr);
        document.getElementById('popcart').setAttribute('data-content', popStr);
        $('#popcart').popover('show');
    }
    function clearCart() {
        cart = JSON.parse(localStorage.getItem('cart'));
        for (var item in cart) {
            document.getElementById('div' + item).innerHTML = '<button id="' + item + '" class="btn btn-primary cart">Add To Cart</button>'
        }
        localStorage.clear();
        cart = {};
        updateCart(cart);
    }
    function updateCart(cart) {
        var sum = 0;
        for (var item in cart) {
            sum = sum + cart[item][0];
            document.getElementById('div' + item).innerHTML = "<button id='minus" + item + "' class='btn btn-primary minus'>-</button> <span id='val" + item + "''>" + cart[item][0] + "</span> <button id='plus" + item + "' class='btn btn-primary plus'> + </button>";
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        document.getElementById('cart').innerHTML = sum;
        console.log(cart);
        updatePopover(cart);
    }
    // If plus or minus button is clicked, change the cart as well as the display value
    $('.divpr').on("click", "button.minus", function () {
        a = this.id.slice(7);
        cart['pr' + a][0] = cart['pr' + a][0] - 1;
        cart['pr' + a][0] = Math.max(0, cart['pr' + a][0]);
        document.getElementById('valpr' + a).innerHTML = cart['pr' + a][0];
        updateCart(cart);
    });
    $('.divpr').on("click", "button.plus", function () {
        a = this.id.slice(6);
        cart['pr' + a][0] = cart['pr' + a][0] + 1;
        document.getElementById('valpr' + a).innerHTML = cart['pr' + a][0];
        updateCart(cart);
    });
</script>


{% endblock %}
