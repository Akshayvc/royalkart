{% load static %}
{% block body_block %}

<!DOCTYPE HTML>
<html>
<head>
<title>login</title>
<!-- Custom Theme files -->
<link href="{% static 'css/login.css' %}" rel="stylesheet" type="text/css" media="all"/>
<!-- Custom Theme files -->
<script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/1.8.1/jquery.min.js"></script>

<!--Google Fonts-->


</head>
<body>

<div class="login">
	<h2>Login</h2>
	<form method="post" action="{% url 'shop:user_login' %}">
      {% csrf_token %}
      {# A more "HTML" way of creating the login form#}
		<input type="text" name="username" class="user active" value="User name" onfocus="this.value = '';" onblur="if (this.value == '') {this.value = 'User name';}"/>
		<input type="password" name="password" class="lock active" value="Password" onfocus="this.value = '';" onblur="if (this.value == '') {this.value = 'Password';}"/>
	
	
	<div class="login-bwn">
	   <input type="submit" value="Log in" />
	</div>
</form>
</div>

</html>
