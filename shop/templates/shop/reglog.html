{% load static %}
<!DOCTYPE html>
<html>
<head>
		<meta charset="utf-8">
		<link href="{% static 'css/style2.css' %}" rel='stylesheet' type='text/css' />
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<script type="application/x-javascript"> addEventListener("load", function() { setTimeout(hideURLbar, 0); }, false); function hideURLbar(){ window.scrollTo(0,1); } </script>
		<!--webfonts-->
		<link href='http://fonts.googleapis.com/css?family=Open+Sans:400,300,600,700,800' rel='stylesheet' type='text.css'/>
		<!--//webfonts-->
</head>
<body style="margin-top:-80px">
	<div class="main">
		<div class="header" >
			<h1>Login or Create a Free Account!</h1>
		</div>
			<form action="/shop/data/" method="post">{% csrf_token %}
				<ul class="left-form">
					<h2>New Account:</h2>
					<li>
						<input type="text" placeholder="Username" id="name" name="name" required/>
						<div class="clear"> </div>
					</li> 
					<li>
						<input type="text" id="email" name="email" placeholder="Email" required/>
						<div class="clear"> </div>
					</li>
					<li>
						<input type="text" id="city" name="city" placeholder="City" required/>
						<div class="clear"> </div>
					</li> 
					<li>
						<input type="text" id="pincode" name="pincode" placeholder="Pin Code" required/>
						<div class="clear"> </div>
					</li>
					<li>
						<input type="text" id="mobile" name="mobile" placeholder="Mobile" required/>
						<div class="clear"> </div>
					</li>
					<li>
						<input type="password" id="password" name="password" placeholder="password" required/>
						<div class="clear"> </div>
					</li> 
					<li>
						<input type="password" id="confirm" name="confirm" placeholder="Confirm Password" required/>
						<div class="clear"> </div>
					</li> 
					<input type="submit" onclick="return Validate()" value="Create Account">
						<div class="clear"> </div>
                </ul>
            </form>
            <form action="/shop/" method="post">{% csrf_token %}
				<ul class="right-form">
                        <h3>Login:</h3>
                        <div>
                            <li><input type="text" id="name" name="name" placeholder="Username" required/></li>
                            <li> <input type="password" id="name" name="name" placeholder="Password" required/></li>
                        </div>
                        <div style="margin:-1em 8.5em"><input type="submit" onclick="myFunction()" value="Login" ></div>
                        <div class="clear"> </div>
                    </ul>
                    <div class="clear"> </div>
					
			</form>
			
		</div>
        <script>
            function Validate() {
              var password = document.getElementById("password").value;
              var cpassword = document.getElementById("confirm").value;
              if ( password != cpassword) {
                alert("password do not match");
                return false;
              }
              return true;
            }
          </script>
</body>
</html>
