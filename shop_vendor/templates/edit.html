{% load static %}
<head>
    <link href="{% static 'css/theme.css' %}" rel="stylesheet" media="all">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://unpkg.com/gijgo@1.9.13/js/gijgo.min.js" type="text/javascript"></script>
    <link href="https://unpkg.com/gijgo@1.9.13/css/gijgo.min.css" rel="stylesheet" type="text/css" />
    
      
</head>
<body>
<center>
    {% for i in edit %}
    <div class="page-wrapper">
            <div class="page-content--bge5">
                <div class="container">
                    <div class="login-wrap">
                        <div class="login-content">
                            <div class="login-logo">
                                <h2>Edit Product Information</h2>
                            </div><br>
                            
                            <div class="login-form">
                                    <form action="/shop_vendor/update/" method="post">
                                        {% csrf_token %}
                                    <input type="hidden" name="pid" value="{{ i.id }}">
                                    <div class="form-group">
                                        <label><h4>Product Name</h4></label>
                                        <input class="au-input au-input--full" type="text" name = "pname" value="{{ i.product_name }}" placeholder="Product Name" autocomplete="off" required>
                                    </div><br>
                                    <div class="form-group">
                                        <label><h4>Description</h4></label>
                                        <input class="au-input au-input--full" type="text" name = "desc" value="{{ i.desc }}" placeholder="Description" autocomplete="off" required>
                                    </div><br>
                                    <div class="form-group">
                                        <label><h4>Publish Date</h4></label>
                                        <input class="au-input au-input--full" type="text" name = "pub_date" value="{{ i.pub_date }}" id="datepicker" placeholder="yyyy-mm-dd" maxlength=10 autocomplete="off" required>
                                        <!--<input type="text" id="datepicker" width="450" />-->
                                        <script>
                                            $('#datepicker').datepicker({
                                                uiLibrary: 'bootstrap4',
                                            format: 'yyyy-mm-dd'
                                            });
                                        </script>
                                    <!--<div class="form-group">
                                        <label>Image</label>
                                        <input type="file" id="file_input"  placeholder="Image" style="color:transparent;" >
                                        <input type="text" id="title" value="{% if i.image %} {{ i.image.url }} {% else %} {% static 'shop/sample.jpg' %} {% endif %}" name = "image" required>
                                    </div>-->
                                    <div class="form-group">
                                        <label><h4>Price</h4></label>
                                        <input class="au-input au-input--full" type="text" name = "price" value="{{ i.price }}" placeholder="Password" autocomplete="off" required>
                                    </div><br>
                                    <button class="au-btn au-btn--block au-btn--green m-b-20" type="submit">UPDATE</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    
        </div>
        {% endfor %}
        {% block js %}
        
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
        <script src="https://unpkg.com/gijgo@1.9.13/js/gijgo.min.js" type="text/javascript"></script>
          {% endblock %}
    </center>
</body>
